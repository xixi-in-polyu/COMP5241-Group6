name: Maintenance Migration

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA on main containing the reviewed migration
        required: true
        type: string
      reason:
        description: Approved maintenance-window reason and rollback notes
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-request:
    if: vars.MAINTENANCE_MIGRATIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Validate immutable main commit
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full commit SHA is required." >&2; exit 1; }
          git -c protocol.version=2 ls-remote "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" refs/heads/main | grep -q "^$REQUESTED_SHA" || {
            echo "The requested SHA must be the current main head." >&2
            exit 1
          }
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Reason: ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
  administrator-approval:
    needs: validate-request
    runs-on: ubuntu-24.04
    environment: maintenance-admin-approval
    steps:
      - run: echo "Administrator approval recorded."
  peer-approval:
    needs: administrator-approval
    runs-on: ubuntu-24.04
    environment: maintenance-peer-approval
    steps:
      - run: echo "Peer approval recorded."
  migrate:
    needs: [validate-request, administrator-approval, peer-approval]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: learning-platform/package-lock.json
      - name: Install dependencies
        working-directory: learning-platform
        run: npm ci
      - name: Validate recovery configuration
        env:
          NEON_API_KEY: ${{ secrets.PRODUCTION_NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PRODUCTION_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
        run: |
          missing=()
          for name in NEON_API_KEY NEON_PROJECT_ID NEON_BRANCH_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "Missing recovery configuration: ${missing[*]}" >&2
            exit 1
          fi
      - name: Create a 72-hour Neon maintenance backup
        working-directory: learning-platform
        env:
          NEON_API_KEY: ${{ secrets.PRODUCTION_NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PRODUCTION_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
        run: |
          expires_at=$(date -u --date '+72 hours' +'%Y-%m-%dT%H:%M:%SZ')
          branch_name="backup/maintenance-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          npx neon branches create \
            --project-id "$NEON_PROJECT_ID" \
            --parent "$NEON_BRANCH_ID" \
            --name "$branch_name" \
            --expires-at "$expires_at" \
            --no-compute \
            --no-secrets
          {
            echo "### Maintenance recovery point"
            echo "- Branch: \`$branch_name\`"
            echo "- Expires: $expires_at"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply explicitly approved migration
        working-directory: learning-platform
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
          ALLOW_DESTRUCTIVE_MIGRATION: "true"
        run: npm run db:migrate:deploy
