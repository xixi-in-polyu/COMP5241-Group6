<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
<rect width="800" height="450" fill="#FFFFFF"/>
<g font-family="Avenir Next, Segoe UI, sans-serif" fill="#1F2322">
<text x="32" y="48" font-size="20" font-weight="750" letter-spacing="1.4">SAME MODEL, DIFFERENT HARNESS</text>
<text x="32" y="72" font-size="13" fill="#6B7270">capability is shaped by the runtime</text>

<g>
  <rect x="34" y="104" width="342" height="238" rx="12" fill="#FFFFFF" stroke="#6B7270" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="56" y="134" font-size="13" font-weight="750" fill="#6B7270">MODEL ALONE</text>
  <rect x="56" y="154" width="130" height="58" rx="9" fill="#E2EBEF" stroke="#1F2322" stroke-width="1.2"/>
  <text x="121" y="180" text-anchor="middle" font-size="12" font-weight="700">MODEL</text>
  <text x="121" y="197" text-anchor="middle" font-size="9" fill="#6B7270">predicts text</text>
  <rect x="56" y="236" width="210" height="56" rx="9" fill="#FFFFFF" stroke="#6B7270" stroke-width="1"/>
  <text x="72" y="258" font-size="10" fill="#6B7270">“Here is a possible fix…”</text>
  <text x="72" y="276" font-size="9" fill="#6B7270">no file changed · no test run</text>
  <text x="56" y="320" font-size="10" fill="#BE6A58">an answer, not a result</text>

  <rect x="420" y="104" width="346" height="238" rx="12" fill="#E8EEE1" stroke="#1F2322" stroke-width="1.2"/>
  <text x="442" y="134" font-size="13" font-weight="750">WITH A HARNESS</text>
  <rect x="442" y="154" width="130" height="58" rx="9" fill="#E2EBEF" stroke="#1F2322" stroke-width="1.2"/>
  <text x="507" y="180" text-anchor="middle" font-size="12" font-weight="700">MODEL</text>
  <text x="507" y="197" text-anchor="middle" font-size="9" fill="#6B7270">same weights</text>
  <rect x="596" y="154" width="142" height="24" rx="6" fill="#FFFFFF" stroke="#1F2322" stroke-width=".9"/><text x="667" y="170" text-anchor="middle" font-size="9">tools</text><rect x="596" y="186" width="142" height="24" rx="6" fill="#FFFFFF" stroke="#1F2322" stroke-width=".9"/><text x="667" y="202" text-anchor="middle" font-size="9">sessions</text><rect x="596" y="218" width="142" height="24" rx="6" fill="#FFFFFF" stroke="#1F2322" stroke-width=".9"/><text x="667" y="234" text-anchor="middle" font-size="9">approvals</text>
  <text x="442" y="252" font-size="10" fill="#9FAF91">a verified change on disk</text>
  <text x="442" y="274" font-size="9" fill="#6B7270">state kept · action checked · evidence logged</text>
  <text x="442" y="320" font-size="10" fill="#9FAF91">a result, not just an answer</text>

  <rect x="34" y="362" width="732" height="38" rx="8" fill="#F5E6DF"/>
  <text x="52" y="386" font-size="11" fill="#6B7270">DeepSeek Harness: sessions · tools · plugins · skills · subagents · approvals</text>
  <text x="400" y="424" text-anchor="middle" font-size="10" fill="#6B7270">Judge the harness, not just the model.</text>
</g>
</g>
</svg>